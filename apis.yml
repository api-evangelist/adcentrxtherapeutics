aid: adcentrxtherapeutics
name: Adcentrx Therapeutics
description: 'Adcentrx Therapeutics is a clinical-stage biotechnology company headquartered
  in San Diego, California, developing next-generation antibody-drug conjugates (ADCs)
  and protein conjugate therapeutics for cancer and other life-threatening diseases.
  Its proprietary i-Conjugation technology platform pairs stable conjugation chemistry
  and protease-cleavable linkers with novel small-molecule payloads; the clinical pipeline
  includes ADRX-0706 (Nectin-4) and ADRX-0405 (STEAP1). The company was surfaced via
  the API Evangelist harvest backlog (source: secondary-market). It publishes a corporate
  and investor-relations website only — no developer program, API, SDK, or machine-readable
  specification of any kind was found.'
